# miqulauncher configuration file
# Modern app launcher & dmenu built with miqutoolkit

# ==========================================
# Window & Grid Layout
# ==========================================
width = 800
height = 460
cell_size = 100
spacing = 10
dim_backdrop = false

# ==========================================
# Colors (Hex: #RRGGBB or #RRGGBBAA)
# ==========================================

source = ~/.config/theme/current/miqulauncher.conf

# ==========================================
# Typography & Icons
# ==========================================
font = Sans
font_size = 11
icon_theme = Papirus
corner_radius = 12
border_width = 1
