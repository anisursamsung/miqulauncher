# miqulauncher configuration file
# Modern app launcher & dmenu built with miqutoolkit

# ==========================================
# Window & Grid Layout
# ==========================================
width = 800
height = 460
cell_size = 100
spacing = 10

# ==========================================
# Colors (Hex: #RRGGBB or #RRGGBBAA)
# ==========================================
background = #f4f8fc
surface = #ffffff
surface_variant = #e6eff8
primary = #0066ff
on_primary = #ffffff
primary_container = #cce5ff
on_primary_container = #002b66
text = #0f172a
text_muted = #475569
outline = #99c2ff
outline_variant = #dbeafe

# ==========================================
# Typography & Icons
# ==========================================
font = Sans
font_size = 11
icon_theme = Papirus
corner_radius = 12
border_width = 1
